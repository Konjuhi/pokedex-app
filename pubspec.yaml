name: pokedex_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  sembast: ^3.6.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # API
  dio: ^5.4.1
  cached_network_image: ^3.3.1
  
  # UI
  go_router: ^13.2.0
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  
  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  google_fonts: ^6.2.1

  lottie: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  
  # Testing
  mockito: ^5.4.4
  network_image_mock: ^2.1.1
  flutter_launcher_icons: 0.14.3
  flutter_native_splash: ^2.4.4

flutter:

  uses-material-design: true

  assets:
    - assets/common/
    - assets/animations/
    - assets/screenshots/


# Flutter Native Splash configuration
flutter_native_splash:
  color: "#ffffff"
  color_android: "#ffffff"
  color_dark_android: "#121212"
  color_ios: "#ffffff"
  color_dark_ios: "#121212"
  color_web: "#ffffff"
  color_dark_web: "#121212"
  image: "assets/common/app-icon.png"

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  ios: true
  android: false
  image_path_ios: "assets/common/app-icon.png"
  image_path_ios_dark_transparent: "assets/common/app-icon.png"
 # image_path_android: "assets/android/app-icon-android.png"
  #adaptive_icon_background: "assets/android/app-icon-background.png"
 # adaptive_icon_foreground: "assets/android/app-icon-foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/common/app-icon.png"


